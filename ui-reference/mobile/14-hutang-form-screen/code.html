<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hutang Baru - LAVENDER</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#fffbff",
                        "inverse-surface": "#293138",
                        "inverse-primary": "#cfbcff",
                        "secondary-fixed-dim": "#c5c7c8",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#464000",
                        "background": "#f6faff",
                        "primary-container": "#7c6ba8",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#4e4800",
                        "secondary-fixed": "#e1e3e4",
                        "secondary-container": "#e1e3e4",
                        "surface-container-low": "#ecf5fe",
                        "outline-variant": "#cac4d0",
                        "error-container": "#ffdad6",
                        "surface-tint": "#655590",
                        "primary": "#62528d",
                        "tertiary": "#676011",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e0e9f2",
                        "on-background": "#141d23",
                        "surface": "#f6faff",
                        "on-secondary-fixed": "#191c1d",
                        "tertiary-fixed-dim": "#d3c970",
                        "surface-container": "#e6eff8",
                        "inverse-on-surface": "#e9f2fb",
                        "surface-container-highest": "#dbe4ed",
                        "on-surface": "#141d23",
                        "on-tertiary-fixed": "#1f1c00",
                        "surface-variant": "#dbe4ed",
                        "surface-dim": "#d2dbe4",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#626566",
                        "on-surface-variant": "#49454f",
                        "on-secondary-fixed-variant": "#454748",
                        "tertiary-fixed": "#f0e589",
                        "surface-bright": "#f6faff",
                        "on-primary-fixed": "#200f48",
                        "outline": "#7a7580",
                        "tertiary-container": "#b7ad58",
                        "on-primary-fixed-variant": "#4d3d76",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#e9ddff",
                        "secondary": "#5c5f60",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#cfbcff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "lg": "24px",
                        "margin-desktop": "40px",
                        "xs": "4px",
                        "md": "16px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "body-md": ["Public Sans"],
                        "label-md": ["Public Sans"],
                        "headline-sm": ["Public Sans"],
                        "display-lg": ["Public Sans"],
                        "label-lg": ["Public Sans"],
                        "headline-md": ["Public Sans"],
                        "headline-lg": ["Public Sans"],
                        "body-lg": ["Public Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["16px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen antialiased flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface shadow-sm flex items-center px-margin-mobile h-16 transition-colors duration-200">
<button class="mr-4 text-on-surface-variant hover:bg-surface-container-high rounded-full p-2 -ml-2 transition-colors duration-200 active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary flex-1">Hutang Baru</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[88px] pb-[104px] px-margin-mobile flex flex-col gap-lg max-w-md mx-auto w-full">
<!-- Pelanggan Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant px-1">Pelanggan</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden">
<!-- Search Bar -->
<div class="p-md border-b border-outline-variant/30 bg-surface-container-lowest">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-[48px] pl-10 pr-4 rounded-lg bg-surface-container-high border-none focus:ring-2 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 outline-none transition-shadow" placeholder="Cari nama user..." type="text"/>
</div>
</div>
<!-- User List -->
<div class="flex flex-col">
<!-- Selected User -->
<button class="w-full flex items-center justify-between p-md bg-primary-container/20 border-l-4 border-primary text-left hover:bg-primary-container/30 transition-colors">
<span class="font-body-md text-body-md text-on-surface font-medium">Andito Pratama (Dito)</span>
<span class="material-symbols-outlined text-primary" data-icon="check_circle">check_circle</span>
</button>
<!-- Unselected User 1 -->
<button class="w-full flex items-center justify-between p-md border-t border-outline-variant/20 bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left">
<span class="font-body-md text-body-md text-on-surface">Siti Aminah</span>
</button>
<!-- Unselected User 2 -->
<button class="w-full flex items-center justify-between p-md border-t border-outline-variant/20 bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-left">
<span class="font-body-md text-body-md text-on-surface">Budi Santoso</span>
</button>
</div>
</div>
</section>
<!-- Jumlah Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant px-1">Jumlah</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-md flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="jumlah-awal">Jumlah Awal *</label>
<div class="relative flex items-center mt-1">
<span class="absolute left-4 font-body-md text-body-md text-on-surface font-medium">Rp</span>
<input class="w-full min-h-[48px] pl-12 pr-4 rounded-lg bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface outline-none transition-all" id="jumlah-awal" type="text" value="100.000"/>
</div>
</div>
</section>
<!-- Catatan Section -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-lg text-label-lg text-on-surface-variant px-1">Catatan</h2>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-md flex flex-col gap-xs">
<label class="sr-only" for="catatan">Catatan (opsional)</label>
<textarea class="w-full p-4 rounded-lg bg-surface border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 outline-none transition-all resize-none min-h-[96px]" id="catatan" placeholder="(opsional)" rows="3"></textarea>
</div>
</section>
</main>
<!-- BottomNavBar (Action Form Layout) -->
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-between gap-md items-center px-margin-mobile py-4 bg-surface border-t border-outline-variant shadow-lg max-w-md mx-auto right-0">
<button class="flex flex-1 items-center justify-center gap-2 text-primary border border-primary bg-surface-container-lowest rounded-full px-6 py-3 min-h-[48px] transition-all duration-300 active:scale-95 hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
<span class="font-label-lg text-label-lg">Batal</span>
</button>
<button class="flex flex-1 items-center justify-center gap-2 bg-primary text-on-primary rounded-full px-6 py-3 min-h-[48px] transition-all duration-300 active:scale-95 hover:bg-primary/90 shadow-md">
<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span>
<span class="font-label-lg text-label-lg">Simpan</span>
</button>
</div>
</body></html>
