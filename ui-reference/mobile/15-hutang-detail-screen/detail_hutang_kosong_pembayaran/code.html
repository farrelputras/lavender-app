<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex items-center px-4 h-14 z-40">
<button aria-label="Go back" class="text-primary hover:opacity-80 transition-all active:scale-95 flex items-center justify-center p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm ml-2 text-on-surface flex-1 truncate">Detail Hutang</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 py-6 flex flex-col gap-8 pb-28">
<!-- Hero Summary Card -->
<section class="bg-surface-container-lowest rounded-2xl shadow-md p-6 flex flex-col gap-5 border border-outline-variant/20">
<!-- Pelanggan Info -->
<div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-1">Pelanggan</h2>
<div class="font-headline-md text-headline-md text-on-surface">Andito Pratama (Dito)</div>
</div>
<!-- Divider -->
<div class="h-px bg-outline-variant/30 w-full rounded-full"></div>
<!-- Debt Info -->
<div>
<div class="flex justify-between items-start mb-2">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Sisa Hutang</h2>
<span class="bg-error-container text-on-error-container font-label-md text-label-md px-3 py-1 rounded-full inline-flex items-center">
                        AKTIF
                    </span>
</div>
<div class="font-display-lg text-display-lg text-error break-words">Rp 500.000</div>
</div>
</section>
<!-- Pembayaran Section -->
<section class="flex flex-col gap-4">
<h3 class="font-label-lg text-label-lg text-on-surface">Pembayaran</h3>
<!-- Empty State -->
<div class="flex flex-col items-center justify-center py-8 px-4 rounded-2xl bg-surface-container-low border border-dashed border-outline-variant/50 text-center">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant/30 mb-4" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<p class="font-body-md text-body-md text-on-surface-variant">Belum ada pembayaran</p>
</div>
</section>
</main>
<!-- Sticky Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background border-t border-outline-variant/20 pb-safe z-50">
<button class="w-full bg-primary text-on-primary rounded-xl h-[48px] flex items-center justify-center gap-2 font-label-lg text-label-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-sm">
<span class="material-symbols-outlined text-[20px]">add</span>
            TAMBAH PEMBAYARAN
        </button>
